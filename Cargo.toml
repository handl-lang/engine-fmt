[package]
name = "hnl-engine-fmt"
version = "0.1.0"
edition = "2024"
description = "Data-driven AST formatter engine (ADR-0044 \"language as data\")."
license = "MIT"
repository = "https://github.com/handl-lang/engine-fmt"
homepage = "https://handl-lang.github.io/docs/engine-fmt/"
documentation = "https://handl-lang.github.io/docs/engine-fmt/reference/"
readme = "README.md"
keywords = ["handl", "engine", "formatter", "language-as-data"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-fmt (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
